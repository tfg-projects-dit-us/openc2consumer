spring.application.name=openc2-consumer

##Configuración de evidencias
# Tipos admitidos por VqlService; esta lista no amplía el catálogo de ThreatHuntingService.
# Para registrar un tipo se necesita su fichero <evidencia>.artifact en artifacts.path.
# Los huntflows y su ejecución requieren implementación adicional en el servicio del perfil.
ueba.evidences=userlogon,usersession,userlogout,usersessionduration
ueba.user.vigilancelevels=STANDARD,SUSPICIOUS,CRITICAL
#ruta a los ficheros de artefactos (cada artefacto es un fichero con el mismo nombre que el nombre de la evidencia)
artifacts.path=D:\\soardata\\artifacts

velociraptor.host=localhost
velociraptor.port=8000
velociraptor.ssl=false
velociraptor.username=admin
velociraptor.password=admin